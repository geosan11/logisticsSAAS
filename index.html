<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    
    <!-- iOS PWA Support -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EHI Ops">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon.png">

    <!-- Prevent phone number detection formatting -->
    <meta name="format-detection" content="telephone=no">

    <!-- Theme color for Safari toolbar — must match --color-canvas in src/index.css -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

    <title>EHI Logistics SaaS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
    </noscript>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('ehi-theme') || 'dark';
          document.documentElement.classList.add(t);
          var d = localStorage.getItem('ehi-density') || 'spacious';
          document.documentElement.setAttribute('data-density', d);
          document.documentElement.classList.add('density-' + d);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Branded splash screen — replaced by React when app mounts. Themed
           via html.dark/html.light (set synchronously by the inline script
           above, before this paints) instead of a hardcoded color, so it
           never flashes the wrong theme against whatever LoginScreen/the
           app renders next. This app's default theme is DARK (see the inline
           script and src/lib/useTheme.ts); the light rule below is the
           fallback for html.light. Backgrounds match --color-canvas. -->
      <style>
        #splash {
          min-height: 100dvh;
          width: 100%;
          background: #ffffff;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 20px;
          box-sizing: border-box;
          padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        html.dark #splash { background: #000000; }
        #splash .ehi-splash-mark-bg { fill: rgba(0,0,0,0.06); }
        #splash .ehi-splash-mark-text { fill: #09090b; }
        html.dark #splash .ehi-splash-mark-bg { fill: rgba(255,255,255,0.08); }
        html.dark #splash .ehi-splash-mark-text { fill: #f4f4f5; }
        #splash .ehi-splash-ring {
          width: 32px; height: 32px;
          border: 2px solid rgba(0,0,0,0.1);
          border-top-color: #09090b;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }
        html.dark #splash .ehi-splash-ring {
          border-color: rgba(255,255,255,0.1);
          border-top-color: #f4f4f5;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <div id="splash">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="64" height="64" rx="14" class="ehi-splash-mark-bg" />
          <text x="32" y="42" text-anchor="middle" class="ehi-splash-mark-text" font-size="28" font-weight="800" font-family="monospace">E</text>
        </svg>
        <div class="ehi-splash-ring"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
